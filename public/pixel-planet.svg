<svg viewBox="0 0 24 24" width="512" height="512" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <!-- The planet disc, used to clip the rotating surface -->
    <clipPath id="disc">
      <rect x="9" y="5"  width="4"  height="1" />
      <rect x="7" y="6"  width="8"  height="1" />
      <rect x="6" y="7"  width="10" height="1" />
      <rect x="5" y="8"  width="12" height="1" />
      <rect x="5" y="9"  width="12" height="1" />
      <rect x="4" y="10" width="14" height="1" />
      <rect x="4" y="11" width="14" height="1" />
      <rect x="4" y="12" width="14" height="1" />
      <rect x="4" y="13" width="14" height="1" />
      <rect x="5" y="14" width="12" height="1" />
      <rect x="5" y="15" width="12" height="1" />
      <rect x="6" y="16" width="10" height="1" />
      <rect x="7" y="17" width="8"  height="1" />
      <rect x="9" y="18" width="4"  height="1" />
    </clipPath>
  </defs>

  <!-- Ring (back half: top arc of the ellipse, behind the planet) -->
  <g fill="#9ca3af">
    <rect x="7"  y="8"  width="8" height="1" />
    <rect x="4"  y="9"  width="3" height="1" />
    <rect x="15" y="9"  width="3" height="1" />
    <rect x="2"  y="10" width="2" height="1" />
    <rect x="18" y="10" width="2" height="1" />
    <rect x="0"  y="11" width="2" height="1" />
    <rect x="20" y="11" width="2" height="1" />
  </g>

  <!-- Surface, clipped to the disc -->
  <g clip-path="url(#disc)">
    <!-- Ocean base -->
    <rect x="4" y="5" width="14" height="14" fill="#6b7280" />

    <!-- Continents: two tiled copies scrolling left, period 14 (seamless loop) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-14 0" dur="14s" repeatCount="indefinite" />
      <g fill="#d4d4d8" id="land">
        <rect x="5"  y="8"  width="2" height="1" />
        <rect x="5"  y="9"  width="3" height="1" />
        <rect x="6"  y="10" width="2" height="1" />
        <rect x="10" y="11" width="3" height="1" />
        <rect x="10" y="12" width="4" height="1" />
        <rect x="11" y="13" width="3" height="1" />
        <rect x="12" y="14" width="2" height="1" />
        <rect x="14" y="7"  width="2" height="1" />
        <rect x="15" y="8"  width="1" height="1" />
        <rect x="6"  y="15" width="2" height="1" />
        <rect x="7"  y="16" width="1" height="1" />
      </g>
      <g fill="#d4d4d8" transform="translate(14 0)">
        <rect x="5"  y="8"  width="2" height="1" />
        <rect x="5"  y="9"  width="3" height="1" />
        <rect x="6"  y="10" width="2" height="1" />
        <rect x="10" y="11" width="3" height="1" />
        <rect x="10" y="12" width="4" height="1" />
        <rect x="11" y="13" width="3" height="1" />
        <rect x="12" y="14" width="2" height="1" />
        <rect x="14" y="7"  width="2" height="1" />
        <rect x="15" y="8"  width="1" height="1" />
        <rect x="6"  y="15" width="2" height="1" />
        <rect x="7"  y="16" width="1" height="1" />
      </g>
    </g>

    <!-- Darkened limb for a spherical feel -->
    <rect x="14" y="5" width="4" height="14" fill="#000000" opacity="0.18" />
  </g>

  <!-- Specular highlight (static) -->
  <g fill="#f4f4f5">
    <rect x="7" y="7" width="1" height="1" />
    <rect x="8" y="7" width="1" height="1" />
    <rect x="7" y="8" width="1" height="1" />
  </g>

  <!-- Ring (front half: bottom arc of the ellipse, in front of the planet) -->
  <g fill="#d4d4d8">
    <rect x="0"  y="12" width="2" height="1" />
    <rect x="20" y="12" width="2" height="1" />
    <rect x="2"  y="13" width="2" height="1" />
    <rect x="18" y="13" width="2" height="1" />
    <rect x="4"  y="14" width="3" height="1" />
    <rect x="15" y="14" width="3" height="1" />
    <rect x="7"  y="15" width="8" height="1" />
  </g>

  <!-- Twinkling pixel stars -->
  <g fill="#e4e4e7">
    <rect x="1" y="3" width="1" height="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s"   begin="0s"   repeatCount="indefinite" />
    </rect>
    <rect x="21" y="5" width="1" height="1">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="20" width="1" height="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="3" y="21" width="1" height="1">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" begin="0.3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
